<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Tag Game</title>
    <link rel="stylesheet" href="tag.css">
</head>
<body>
    <div id="menuScreen" class="screen menu-box">
        <h1>TAG!</h1>
        <p style="color: #94a3b8; margin-bottom: 25px;">20s Rounds • First to 3 Wins</p>
        <button class="menu-btn" onclick="startMatch('ai')">> 1-Player vs Smart AI</button>
        <br>
        <button class="menu-btn" onclick="startMatch('pvp')" style="background-color: #facc15;">> 2-Player Local</button>
    </div>

    <div id="gameScreen" class="screen hidden">
        <h1 id="gameTitle">Tag Game</h1>
        <div id="match-tracker">
            <span style="font-size: 0.85rem; color: #38bdf8; margin-right: 2px;">Blue</span>
            <div class="round-dot" id="dot-0"></div><div class="round-dot" id="dot-1"></div><div class="round-dot" id="dot-2"></div><div class="round-dot" id="dot-3"></div><div class="round-dot" id="dot-4"></div>
            <span style="font-size: 0.85rem; color: #f43f5e; margin-left: 2px;">Red</span>
        </div>
        <div id="scoreboard">
            <span id="scoreText">Time Left: <span id="timer">20</span>s</span> | 
            <span id="status" style="color: #f43f5e;">Red is it!</span>
        </div>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="instructions" id="instructionText">Use WASD to move.</div>
        <button class="menu-btn" style="margin-top: 15px; padding: 6px 12px; font-size: 0.85rem;" onclick="returnToMenu()">Main Menu</button>
    </div>

    <script src="tag.js"></script>
</body>
</html>
